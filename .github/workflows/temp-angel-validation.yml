name: Temporary Angel Validation

on:
  push:
    branches:
      - feature/colaborador-anjo

permissions:
  contents: read

jobs:
  baseline-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Baseline TypeScript check
        id: baseline_check
        continue-on-error: true
        run: |
          rm -f node_modules/typescript/tsbuildinfo
          pnpm check

      - name: Record baseline result
        run: echo "Baseline TypeScript outcome = ${{ steps.baseline_check.outcome }}"

  validate-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Feature TypeScript check
        id: feature_check
        continue-on-error: true
        run: |
          rm -f node_modules/typescript/tsbuildinfo
          pnpm check

      - name: Migration script syntax check
        run: node --check scripts/migrate-programa-integracao-anjo-user.mjs

      - name: Build
        run: pnpm build

      - name: Angel access guard regression test
        run: pnpm exec vitest run server/angel-access-guard.test.ts

      - name: Record feature TypeScript result
        run: echo "Feature TypeScript outcome = ${{ steps.feature_check.outcome }}"
