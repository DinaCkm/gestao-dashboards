name: one-time-fix-nota-final

on:
  push:
    branches:
      - tmp/fix-nota-final-seguro-20260911
    paths:
      - .github/workflows/one-time-fix-nota-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply one-line patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/routers/alunosAutonomos.ts')
          text = path.read_text(encoding='utf-8')
          old = '.set({ notaFinal: String(percentual.toFixed(1)) } as any)'
          new = '.set({ notaFinal: String((percentual / 10).toFixed(1)) } as any)'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Patch abortado: esperado 1 trecho alvo, encontrado {count}.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- server/routers/alunosAutonomos.ts

      - name: Commit only the validated patch
        shell: bash
        run: |
          git config user.name "CKM Safe Patch"
          git config user.email "dina@ckmtalents.net"
          git add server/routers/alunosAutonomos.ts
          git commit -m "Corrige escala da nota na avaliação final do curso"
          git pull --rebase origin main
          git push origin HEAD:main
