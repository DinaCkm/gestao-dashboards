name: Programa Integracao - branch check

on:
  push:
    branches:
      - integracao-programa-producao-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: railway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/railway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracao-programa-producao-20260915
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar patches localizados e correcoes do modulo
        shell: python
        run: |
          from pathlib import Path

          index = Path('server/_core/index.ts')
          s = index.read_text(encoding='utf-8')
          imp_anchor = 'import { courseMetadataRouter, ensureCourseMetadataTable } from "../courseMetadataRoutes";\n'
          imp_new = imp_anchor + 'import { programaIntegracaoRouter } from "../programaIntegracaoRoutes";\nimport { registerProgramaIntegracaoPages } from "../programaIntegracaoPages";\n'
          if 'programaIntegracaoRouter' not in s:
              if imp_anchor not in s: raise SystemExit('Anchor de imports do servidor nao encontrado')
              s = s.replace(imp_anchor, imp_new, 1)
          route_anchor = '  // tRPC API\n  app.use(\n    "/api/trpc",\n'
          route_new = '  // Programa de Integracao: APIs e paginas publicas/admin antes do fallback da SPA.\n  app.use(programaIntegracaoRouter);\n  registerProgramaIntegracaoPages(app);\n\n' + route_anchor
          if 'registerProgramaIntegracaoPages(app);' not in s:
              if route_anchor not in s: raise SystemExit('Anchor de rotas do servidor nao encontrado')
              s = s.replace(route_anchor, route_new, 1)
          index.write_text(s, encoding='utf-8')

          dash = Path('client/src/components/DashboardLayout.tsx')
          d = dash.read_text(encoding='utf-8')
          menu_anchor = '''                })}\n              </>\n            ) : (\n'''
          menu_new = '''                })}\n\n                {/* PROGRAMA DE INTEGRACAO - acesso exclusivo do administrador completo */}\n                {isFullAdmin && (\n                  <div className="px-2 pt-1 pb-1">\n                    <SidebarMenu className="px-0">\n                      <SidebarMenuItem>\n                        <SidebarMenuButton\n                          onClick={() => window.location.assign("/programa-integracao")}\n                          tooltip="Processos Integração"\n                          className="h-10 transition-all font-normal hover:bg-sidebar-accent/50"\n                        >\n                          <ClipboardList className="h-4 w-4 text-muted-foreground" />\n                          <span>Processos Integração</span>\n                        </SidebarMenuButton>\n                      </SidebarMenuItem>\n                    </SidebarMenu>\n                  </div>\n                )}\n              </>\n            ) : (\n'''
          if 'window.location.assign("/programa-integracao")' not in d:
              if menu_anchor not in d: raise SystemExit('Anchor do menu administrativo nao encontrado')
              d = d.replace(menu_anchor, menu_new, 1)
          dash.write_text(d, encoding='utf-8')

          catalog = Path('server/programaIntegracaoCatalog.ts')
          c = catalog.read_text(encoding='utf-8')
          c = c.replace('text("aval_reacao_feedback","Qual foi a reação que o novo colaborador teve no feedback? (Somente Gestor)",true,', 'text("aval_reacao_feedback","Qual foi a reação que o novo colaborador teve no feedback? (Somente Gestor)",false,')
          c = c.replace('cycleOptions:[{value:"2",cycle:2,label:"45º dia"},{value:"4",cycle:4,label:"150º dia / fechamento aplicável"}],', 'cycleOptions:[{value:"2",cycle:2,label:"45º dia"},{value:"60",cycle:4,label:"60º dia (Crossboarding - finalização)"},{value:"150",cycle:4,label:"150º dia (Onboarding - finalização)"}],')
          catalog.write_text(c, encoding='utf-8')

          routes = Path('server/programaIntegracaoRoutes.ts')
          r = routes.read_text(encoding='utf-8')
          if 'PROGRAMA_INTEGRACAO_CATALOG' not in r:
              r = r.replace('import { Router, type NextFunction, type Request, type Response } from "express";\n', 'import { Router, type NextFunction, type Request, type Response } from "express";\nimport { PROGRAMA_INTEGRACAO_CATALOG } from "./programaIntegracaoCatalog";\n', 1)
          validation_anchor = '''    const data = req.body || {}; if (!String(data.nomeColaborador || "").trim()) return res.status(400).json({ ok:false, erro:"Informe o nome do colaborador.", campo:"nomeColaborador" });\n    if ((formKey === "pesquisa") && !String(data.nomeColaborador || "").trim()) return res.status(400).json({ ok:false, erro:"Informe seu nome." });\n    if ((formKey === "pesquisa" || formKey === "aval" || formKey === "pdi") && !Number(data.cycle || 0)) return res.status(400).json({ ok:false, erro:"Informe o período desta resposta.", campo:"cycle" });\n    if (formKey === "aval" && !["Gestor","Anjo"].includes(String(data.role || ""))) return res.status(400).json({ ok:false, erro:"Informe se a resposta é do Gestor ou do Anjo.", campo:"role" });\n'''
          validation_new = '''    const data = req.body || {}; if (!String(data.nomeColaborador || "").trim()) return res.status(400).json({ ok:false, erro:"Informe o nome do colaborador.", campo:"nomeColaborador" });\n    const catalog = PROGRAMA_INTEGRACAO_CATALOG[req.params.slug];\n    if (!catalog) return res.status(404).json({ ok:false, erro:"Formulário não encontrado." });\n    if (catalog.identity.unidade && !String(data.unidade || "").trim()) return res.status(400).json({ ok:false, erro:"Informe a unidade.", campo:"unidade" });\n    if (catalog.identity.dataInicio && !String(data.dataInicio || "").trim()) return res.status(400).json({ ok:false, erro:"Informe a data de início.", campo:"dataInicio" });\n    if (catalog.identity.respondent && !String(data.respondentName || "").trim()) return res.status(400).json({ ok:false, erro:"Informe o nome de quem está respondendo.", campo:"respondentName" });\n    if (catalog.identity.cycle && !Number(data.cycle || 0)) return res.status(400).json({ ok:false, erro:"Informe o período desta resposta.", campo:"cycle" });\n    if (formKey === "aval" && !["Gestor","Anjo"].includes(String(data.role || ""))) return res.status(400).json({ ok:false, erro:"Informe se a resposta é do Gestor ou do Anjo.", campo:"role" });\n    const answers = data.answers && typeof data.answers === "object" ? data.answers : {};\n    for (const section of catalog.sections) {\n      for (const question of section.questions) {\n        const conditionalGestor = question.code === "aval_reacao_feedback" && String(data.role || "") === "Gestor";\n        const required = question.required !== false || conditionalGestor;\n        const value = answers[question.code];\n        if (required && (value === undefined || value === null || String(value).trim() === "")) {\n          return res.status(400).json({ ok:false, erro:`Preencha: ${question.label}`, campo:question.code });\n        }\n        if (question.type === "scale" && value !== undefined && value !== null && String(value).trim() !== "") {\n          const n = Number(value); if (!Number.isInteger(n) || n < 0 || n > 5) return res.status(400).json({ ok:false, erro:`Valor inválido em: ${question.label}`, campo:question.code });\n        }\n      }\n    }\n'''
          if validation_anchor in r:
              r = r.replace(validation_anchor, validation_new, 1)
          elif 'const conditionalGestor' not in r:
              raise SystemExit('Anchor de validacao publica nao encontrado')
          routes.write_text(r, encoding='utf-8')

          pages = Path('server/programaIntegracaoPages.ts')
          p = pages.read_text(encoding='utf-8')
          client_anchor = '''if(q.required!==false&&(!v&&String(v)!=='0')){error='Preencha: '+q.label;break;}'''
          client_new = '''const conditionalGestor=q.code==='aval_reacao_feedback'&&values.role==='Gestor';if((q.required!==false||conditionalGestor)&&(!v&&String(v)!=='0')){error='Preencha: '+q.label;break;}'''
          if client_anchor in p:
              p = p.replace(client_anchor, client_new, 1)
          pages.write_text(p, encoding='utf-8')

      - name: Instalar dependencias
        run: corepack enable && pnpm install --no-frozen-lockfile

      - name: Compilar arquivos novos isoladamente
        run: |
          pnpm exec esbuild server/programaIntegracaoDefinitions.ts --platform=node --packages=external --bundle --format=esm --outfile=/tmp/pi-definitions.mjs
          pnpm exec esbuild server/programaIntegracaoCatalog.ts --platform=node --packages=external --bundle --format=esm --outfile=/tmp/pi-catalog.mjs
          pnpm exec esbuild server/programaIntegracaoPages.ts --platform=node --packages=external --bundle --format=esm --outfile=/tmp/pi-pages.mjs
          pnpm exec esbuild server/programaIntegracaoRoutes.ts --platform=node --packages=external --bundle --format=esm --outfile=/tmp/pi-routes.mjs

      - name: Testar migracao em MySQL descartavel
        run: node scripts/migrate-programa-integracao.mjs

      - name: Confirmar quatro tabelas vazias no MySQL descartavel
        run: |
          node - <<'NODE'
          const mysql = require('mysql2/promise');
          (async()=>{
            const c=await mysql.createConnection(process.env.DATABASE_URL);
            const names=['programa_integracao_processos','programa_integracao_respostas','programa_integracao_config','programa_integracao_auditoria'];
            for(const name of names){
              const [r]=await c.query('SELECT COUNT(*) total FROM `'+name+'`');
              if(Number(r[0].total)!==0) throw new Error(name+' nao esta vazia');
              console.log(name+': OK');
            }
            await c.end();
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE

      - name: Build igual ao deploy de producao
        run: pnpm build

      - name: Commitar somente patches validados
        run: |
          if git diff --quiet -- server/_core/index.ts client/src/components/DashboardLayout.tsx server/programaIntegracaoCatalog.ts server/programaIntegracaoRoutes.ts server/programaIntegracaoPages.ts; then
            echo "Patches ja aplicados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts client/src/components/DashboardLayout.tsx server/programaIntegracaoCatalog.ts server/programaIntegracaoRoutes.ts server/programaIntegracaoPages.ts
          git commit -m "feat(integracao): valida campos e conecta modulo ao EcoLider"
          git fetch origin integracao-programa-producao-20260915
          git rebase origin/integracao-programa-producao-20260915
          git push origin HEAD:integracao-programa-producao-20260915
