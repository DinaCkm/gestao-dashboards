name: one-time-sidebar-brand-fix

on:
  push:
    branches:
      - tmp/ajuste-titulo-sidebar-20260913
    paths:
      - .github/workflows/one-time-sidebar-brand-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply sidebar brand patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/muralPresentationEnhancements.ts')
          text = path.read_text(encoding='utf-8')

          old_css = '''    .sidebar-brand-label-enhanced {
      color: #ffffff !important;
      font-size: 0.72rem !important;
      line-height: 1rem !important;
      letter-spacing: 0.01em !important;
      white-space: nowrap !important;
      max-width: 7.4rem;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }'''

          new_css = '''    .sidebar-brand-label-enhanced {
      display: inline-block;
      color: #ffffff !important;
      font-size: 0.72rem !important;
      line-height: 0.92rem !important;
      letter-spacing: 0.01em !important;
      white-space: normal !important;
      max-width: 7.4rem;
      overflow: visible;
      text-overflow: clip;
      flex-shrink: 1;
    }'''

          old_js = '''    brandLabels.forEach((element) => {
      element.textContent = "Ecossistema do B.E.M.";
      element.classList.add("sidebar-brand-label-enhanced");
    });'''

          new_js = '''    brandLabels.forEach((element) => {
      element.replaceChildren(
        document.createTextNode("Ecossistema do"),
        document.createElement("br"),
        document.createTextNode("B.E.M.")
      );
      element.setAttribute("aria-label", "Ecossistema do B.E.M.");
      element.classList.add("sidebar-brand-label-enhanced");
    });'''

          if text.count(old_css) != 1:
              raise SystemExit(f'Patch abortado: bloco CSS esperado não encontrado de forma única ({text.count(old_css)}).')
          if text.count(old_js) != 1:
              raise SystemExit(f'Patch abortado: bloco JS esperado não encontrado de forma única ({text.count(old_js)}).')

          text = text.replace(old_css, new_css, 1).replace(old_js, new_js, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- client/src/muralPresentationEnhancements.ts

      - name: Commit only the validated visual patch
        shell: bash
        run: |
          git config user.name "CKM Safe Patch"
          git config user.email "dina@ckmtalents.net"
          git add client/src/muralPresentationEnhancements.ts
          git commit -m "Ajusta título da marca em duas linhas na sidebar"
          git pull --rebase origin main
          git push origin HEAD:main
